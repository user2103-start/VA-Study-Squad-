<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Squad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6faf2; --surface:#fff; --mint:#b9f0da; --mint-2:#8fe3c3;
  --teal:#0f766e; --teal-d:#0a4f4a; --ink:#0b2f2c; --muted:#4d6b67; --line:#bfe6d8;
  --err:#b42318; --r:14px;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#072522; --surface:#0d3633; --mint:#145a52; --mint-2:#1b7a6e; --teal:#5eead4; --teal-d:#99f6e4; --ink:#e3fbf4; --muted:#9bc4bb; --line:#1c4f48; --err:#fda29b}
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);min-height:100vh}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{background:var(--teal);color:#fff;border-bottom:6px solid var(--mint-2)}
@media (prefers-color-scheme:dark){header{background:#0b3d38;color:#e3fbf4}}
.bar{display:flex;align-items:center;gap:12px;padding:14px 0}
.logo{display:flex;align-items:center;gap:12px;font:800 24px/1 var(--display);letter-spacing:-.02em;cursor:pointer;background:none;border:0;color:inherit}
.mark{flex:none;width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--mint);color:var(--teal-d);border:2px solid var(--mint-2);display:grid;place-items:center;font-size:16px}
.mark img{width:100%;height:100%;object-fit:cover;display:block}

.hero{padding:40px 0 20px}
h1{font:800 clamp(32px,6vw,56px)/1.05 var(--display);letter-spacing:-.03em;color:var(--teal-d)}
.sub{color:var(--muted);margin-top:10px;max-width:52ch}
.search{margin-top:22px;max-width:520px}
.search input{width:100%;padding:13px 16px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface)}
.search input:focus{border-color:var(--teal);outline:none}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding:12px 0 56px}
.card{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);overflow:hidden;padding:0}
button.card{cursor:pointer;transition:border-color .15s,transform .15s}
button.card:hover{border-color:var(--teal);transform:translateY(-2px)}
.thumb{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--mint),var(--mint-2));font:800 40px var(--display);color:var(--teal)}
.thumb b{position:absolute;inset:0;display:grid;place-items:center;font:inherit}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card .t{padding:14px 16px 16px;font-weight:600;line-height:1.3}
.card .s{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:4px}

.back{margin:22px 0 4px;background:none;border:0;color:var(--teal);font-weight:600;cursor:pointer;padding:6px 0}
.title{font:800 clamp(24px,4vw,36px)/1.15 var(--display);letter-spacing:-.02em;color:var(--teal-d);margin:6px 0 18px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;border-bottom:2px solid var(--line);scrollbar-width:thin}
.tab{flex:none;padding:9px 18px;border-radius:999px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap}
.tab:hover{border-color:var(--teal)}
.tab[aria-selected=true]{background:var(--teal);border-color:var(--teal);color:#fff}
@media (prefers-color-scheme:dark){.tab[aria-selected=true]{color:#06221f}}
.panel{padding:22px 0 60px}

.detail{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.detail{grid-template-columns:1fr}}
.banner{width:100%;border-radius:var(--r);border:2px solid var(--line);display:block}
.buy{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:20px}
.badges{display:flex;gap:6px;margin-bottom:10px}
.badge{background:var(--mint);color:var(--teal-d);font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px}
.dates{margin:0 0 14px;display:grid;gap:6px;font-size:15px}
.dates div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.dates span{color:var(--muted)}
.cta{display:block;text-align:center;background:var(--teal);color:#fff;text-decoration:none;font-weight:600;padding:12px;border-radius:var(--r)}
@media (prefers-color-scheme:dark){.cta{color:#06221f}}
.cta:hover{background:var(--teal-d)}
.strips{display:grid;gap:10px}
.strip{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:8px 14px 8px 8px;cursor:pointer;transition:border-color .15s}
.strip:hover{border-color:var(--teal)}
.strip .pi{flex:none;width:112px;aspect-ratio:16/9;border-radius:9px;overflow:hidden;background:linear-gradient(135deg,var(--mint),var(--mint-2))}
.strip .pi img{width:100%;height:100%;object-fit:cover;display:block}
.strip .pt{flex:1;min-width:0;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.strip .go{flex:none;color:var(--teal);font-size:22px}
.sec{font:800 22px var(--display);color:var(--teal-d);margin:34px 0 14px}
.desc{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:20px 22px;max-width:78ch}
.desc p{margin:0 0 .8em}
.desc img{max-width:100%;height:auto;border-radius:10px;display:block}
.note{background:var(--mint);border-radius:var(--r);padding:16px 18px;color:var(--teal-d)}

.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-bottom:16px;font-weight:600}
.crumbs button{background:none;border:0;padding:4px 8px;border-radius:8px;color:var(--teal);cursor:pointer}
.crumbs button:hover{background:var(--mint)}
.crumbs b{padding:4px 8px}
.crumbs i{color:var(--muted);font-style:normal}
.rows{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 16px}
button.row{cursor:pointer;transition:border-color .15s}
button.row:hover{border-color:var(--teal)}
.ico{flex:none;width:42px;height:42px;border-radius:12px;background:var(--mint);color:var(--teal-d);display:grid;place-items:center}
.ico svg{width:22px;height:22px}
.row .t{flex:1;min-width:0;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.row .k{flex:none;font-size:13px;font-weight:600;background:var(--mint);color:var(--teal-d);padding:2px 12px;border-radius:999px}
dialog{width:min(960px,94vw);max-height:94vh;margin:auto;padding:0;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);overflow:hidden}
dialog::backdrop{background:rgba(5,35,32,.72)}
.vh{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:2px solid var(--line)}
.vh h3{flex:1;font:800 18px/1.3 var(--display);color:var(--teal-d);overflow-wrap:anywhere}
.vh a{color:var(--teal);font-weight:600;font-size:14px;white-space:nowrap}
.vh button{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--mint);color:var(--teal-d);font-size:20px;line-height:1;cursor:pointer}
.vb{padding:0}
.vb video{width:100%;aspect-ratio:16/9;background:#000;display:block}
.vb iframe{width:100%;height:78vh;border:0;display:block}
.vb .msg{margin:16px;border-style:solid}
.more{display:block;margin:18px auto 0;padding:10px 22px;border-radius:999px;border:2px solid var(--teal);background:none;color:var(--teal);font-weight:600;cursor:pointer}

.skel{height:210px;border-radius:var(--r);background:linear-gradient(90deg,var(--mint) 25%,var(--surface) 50%,var(--mint) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
.skel.sm{height:66px}
@keyframes sh{to{background-position:-200% 0}}
.msg{padding:28px;border:2px dashed var(--line);border-radius:var(--r);text-align:center;color:var(--muted)}
.msg.err{color:var(--err);border-color:var(--err)}
.msg button{margin-top:12px;padding:9px 18px;border-radius:999px;border:0;background:var(--teal);color:#fff;font-weight:600;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <button class="logo" id="home" aria-label="Study Squad home"><span class="mark" id="mark">SS</span>Study Squad</button>
</div></header>
<main class="wrap" id="app"></main>
<dialog id="viewer" aria-label="Viewer">
  <div class="vh"><h3 id="vt"></h3><span id="vl"></span><button id="vx" aria-label="Close">×</button></div>
  <div class="vb" id="vbody"></div>
</dialog>

<script>
const BASE = 'https://firebasegoogle-zeta.vercel.app';
const LOGO_URL = ''; // <- yahan logo image ka URL daalo (khali rakha to "SS" dikhega)
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;

/* ---------- API ---------- */
async function api(query) {
  let r;
  try { r = await fetch(`${BASE}/api/scholarverse?${query}`); }
  catch { throw new Error('Network/CORS error – check connection or API CORS headers.'); }
  if (!r.ok) throw new Error('Server responded with HTTP ' + r.status);
  return r.json();
}
const getBatches  = () => api('route=batches');
const getOverview = id => api('route=overview&course_id=' + enc(id));
const getContent  = (course, folder, tab, type, page) =>
  api(`route=content&course_id=${enc(course)}&folder_id=${enc(folder)}&tab_id=${enc(tab)}&tab_type=${enc(type || 'content')}&page=${page}&limit=100`);

const getSingle = (course, folder, content) =>
  api(`route=single-content&course_id=${enc(course)}&folder_id=${enc(folder)}&content_id=${enc(content)}`);

/* ---------- Helpers ---------- */
function firstArray(o, d = 0) {
  if (Array.isArray(o)) return o;
  if (!o || typeof o !== 'object' || d > 3) return null;
  for (const k of ['data', 'batches', 'courses', 'results', 'items']) {
    const a = firstArray(o[k], d + 1); if (a) return a;
  }
  for (const v of Object.values(o)) { const a = firstArray(v, d + 1); if (a) return a; }
  return null;
}
const bId   = b => b?._id ?? b?.id ?? b?.course_id ?? b?.batch_id;
const bName = b => b?.name ?? b?.title ?? b?.batch_name ?? b?.course_name ?? 'Untitled batch';
const bImg  = b => b?.thumbnail ?? b?.image ?? b?.banner ?? b?.poster ?? b?.cover ?? b?.img;
const bSub  = b => b?.exam ?? b?.class ?? b?.category ?? b?.language ?? '';
const date = ts => ts ? new Date(+ts * 1000).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';

function clean(html) {
  const doc = new DOMParser().parseFromString(html || '', 'text/html');
  doc.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(n => n.remove());
  doc.body.querySelectorAll('*').forEach(el => {
    [...el.attributes].forEach(a => {
      const v = a.value.trim().toLowerCase();
      if (/^on/.test(a.name) || a.name === 'style' || ((a.name === 'href' || a.name === 'src') && v.startsWith('javascript:'))) el.removeAttribute(a.name);
    });
    if (el.tagName === 'A') { el.target = '_blank'; el.rel = 'noopener noreferrer'; }
    if (el.tagName === 'IMG') el.loading = 'lazy';
  });
  doc.body.querySelectorAll('p').forEach(p => { if (!p.textContent.replace(/\u00a0/g, '').trim() && !p.querySelector('img')) p.remove(); });
  return doc.body.innerHTML;
}

/* ---------- Home ---------- */
let batches = [];
const names = {};   // id -> title (batches + packages)
const parentOf = {}; // package id -> batch id it was opened from
const skeletons = (n = 6, c = '') => `<div class="grid">${`<div class="skel ${c}"></div>`.repeat(n)}</div>`;
const errorBox = (msg, id) => `<div class="msg err"><p>${esc(msg)}</p><button id="${id}">Try again</button></div>`;

async function showHome() {
  history.replaceState(null, '', location.pathname);
  $app.innerHTML = `
    <section class="hero">
      <h1>Pick your batch.</h1>
      <p class="sub">Lectures, notes and practice for JEE and NEET, organised batch by batch.</p>
      <div class="search"><input id="q" type="search" placeholder="Search batches" aria-label="Search batches"></div>
    </section>
    <div id="list">${skeletons()}</div>`;
  const list = document.getElementById('list');
  try {
    if (!batches.length) { batches = firstArray(await getBatches()) || []; batches.forEach(b => names[bId(b)] = bName(b)); }
    const draw = term => {
      const t = term.trim().toLowerCase();
      const rows = batches.filter(b => bName(b).toLowerCase().includes(t));
      list.innerHTML = rows.length
        ? `<div class="grid">${rows.map(b => `
            <button class="card" data-id="${esc(bId(b))}">
              <div class="thumb"><b>${esc(bName(b).charAt(0))}</b>${bImg(b) ? `<img src="${esc(bImg(b))}" alt="" loading="lazy" onerror="this.remove()">` : ''}</div>
              <div class="t">${esc(bName(b))}${bSub(b) ? `<span class="s">${esc(bSub(b))}</span>` : ''}</div>
            </button>`).join('')}</div>`
        : `<div class="msg">No batches found${t ? ' for “' + esc(term) + '”' : ''}.</div>`;
    };
    draw('');
    document.getElementById('q').oninput = e => draw(e.target.value);
    list.onclick = e => { const c = e.target.closest('.card[data-id]'); if (c) openBatch(c.dataset.id); };
  } catch (e) {
    list.innerHTML = errorBox('Could not load batches. ' + e.message, 'retry');
    document.getElementById('retry').onclick = showHome;
  }
}

/* ---------- Batch ---------- */
async function openBatch(id, from) {
  if (from) parentOf[id] = from;
  location.hash = 'batch=' + enc(id);
  const goBack = () => parentOf[id] ? openBatch(parentOf[id]) : showHome();
  $app.innerHTML = `
    <button class="back" id="back">← ${parentOf[id] ? 'Back' : 'All batches'}</button>
    <h2 class="title">${esc(names[id] || 'Batch')}</h2>${skeletons(1)}`;
  document.getElementById('back').onclick = goBack;
  try {
    const res = await getOverview(id);
    const tabs = Array.isArray(res?.data) ? res.data : [];
    if (!tabs.length) throw new Error(res?.message || 'No details returned for this batch.');
    renderBatch(id, tabs, goBack);
  } catch (e) {
    $app.querySelector('.skel').outerHTML = errorBox('Could not load overview. ' + e.message, 'retry');
    document.getElementById('retry').onclick = () => openBatch(id);
  }
}

const layout = (tab, type) => (tab.data || []).find(l => l.layout_type === type);

function overviewHTML(tab, id) {
  const d = layout(tab, 'details')?.layout_data?.[0];
  const pk = layout(tab, 'packages')?.layout_data || [];
  const fq = layout(tab, 'faqs')?.layout_data || [];
  pk.forEach(p => names[p.id] = p.title);
  const side = d ? [
    [d.is_new, d.is_trending].some(Boolean) ? `<div class="badges">${[d.is_new, d.is_trending].filter(Boolean).map(b => `<span class="badge">${esc(b)}</span>`).join('')}</div>` : '',
    (d.start_date || d.end_date) ? `<div class="dates">
      ${d.start_date ? `<div><span>Starts</span>${date(d.start_date)}</div>` : ''}
      ${d.end_date ? `<div><span>Access till</span>${date(d.end_date)}</div>` : ''}</div>` : '',
    d.dynamic_link ? `<a class="cta" href="${esc(d.dynamic_link)}" target="_blank" rel="noopener noreferrer">${+d.is_purchased ? 'Open in app' : 'Enroll now'}</a>` : ''
  ].join('') : '';
  if (!d && !pk.length && !fq.length) return `<div class="msg">Overview details are not available.</div>`;
  return `
    ${d ? `<div class="detail">
      <div>${d.thumbnail ? `<img class="banner" src="${esc(d.thumbnail)}" alt="${esc(d.title)}" onerror="this.remove()">` : ''}</div>
      ${side.trim() ? `<aside class="buy">${side}</aside>` : ''}
    </div>` : ''}
    ${pk.length ? `<h3 class="sec">Included batches</h3><div class="strips" id="pkgs">${pk.map(p => `
      <button class="strip" data-pkg="${esc(p.id)}"><span class="pi">${p.thumbnail ? `<img src="${esc(p.thumbnail)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</span><span class="pt">${esc(p.title)}</span><span class="go" aria-hidden="true">›</span></button>`).join('')}</div>` : ''}
    ${d?.description ? `<h3 class="sec">About this batch</h3><div class="desc">${clean(d.description)}</div>` : ''}
    ${fq.length ? `<h3 class="sec">FAQ</h3>${fq.map(f => `<details class="desc" style="margin-bottom:8px"><summary>${esc(f.question ?? f.title)}</summary><p style="margin-top:8px">${clean(f.answer ?? f.description)}</p></details>`).join('')}` : ''}`;
}

function renderBatch(id, tabs, goBack) {
  const ov = tabs.find(t => t.type === 'overview') || tabs[0];
  const name = layout(ov, 'details')?.layout_data?.[0]?.title || names[id] || 'Batch';
  names[id] = name;
  $app.innerHTML = `
    <button class="back" id="back">← ${parentOf[id] ? 'Back' : 'All batches'}</button>
    <h2 class="title">${esc(name)}</h2>
    <div class="tabs" role="tablist" aria-label="Batch sections">
      ${tabs.map((t, i) => `<button class="tab" role="tab" data-i="${i}" aria-selected="${i === 0}">${esc(t.title)}</button>`).join('')}
    </div>
    <div class="panel" role="tabpanel" id="panel"></div>`;
  document.getElementById('back').onclick = goBack;
  const panel = document.getElementById('panel');
  let ctx;
  const select = i => {
    document.querySelectorAll('.tab').forEach((b, j) => b.setAttribute('aria-selected', j === i));
    const t = tabs[i];
    ctx = {};
    if (t.type === 'overview') {
      panel.innerHTML = overviewHTML(t, id);
      const pk = document.getElementById('pkgs');
      if (pk) pk.onclick = e => { const c = e.target.closest('[data-pkg]'); if (c) openBatch(c.dataset.pkg, id); };
    } else openContent(panel, ctx, id, t);
  };
  document.querySelector('.tabs').onclick = e => { const b = e.target.closest('.tab'); if (b) select(+b.dataset.i); };
  select(0);
}

/* ---------- Tab content (folders) ---------- */
const ICONS = {
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z" fill="currentColor"/></svg>',
  pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
  other: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>'
};
const LABEL = { folder: 'Folder', video: 'Video', pdf: 'PDF', other: 'File' };

function kindOf(it) {
  const t = String(it.type ?? '').toLowerCase();
  if (/folder/.test(t) || it.is_folder === true || +it.is_folder === 1) return 'folder';
  const d = it.data || {};
  const ft = d.file_type ?? d.content_type;   // 1 = PDF, 2 = video
  if (ft == 2) return 'video';
  if (ft == 1) return 'pdf';
  const m = v => { const x = String(v ?? '').toLowerCase(); return /video|lecture|m3u8|mp4/.test(x) ? 'video' : /pdf/.test(x) ? 'pdf' : null; };
  return m(it.file_type) || m(it.content_type) || 'other';
}
const itemId = it => it.entity_id ?? it.id ?? it._id ?? it.folder_id;
const itemTitle = it => it.title ?? it.name ?? it.file_name ?? 'Untitled';

let ctxSeq = 0;
function openContent(panel, ctx, courseId, tab) {
  ctx.cid = ++ctxSeq;
  panel.dataset.cid = ctx.cid;
  ctx.stack = [{ id: '0', title: tab.title }];
  ctx.page = 1;
  ctx.items = [];
  // ek hi delegated handler: breadcrumbs, folders, load more, retry
  panel.onclick = e => {
    const c = e.target.closest('[data-c]'), f = e.target.closest('[data-f]'), o = e.target.closest('[data-o]');
    if (c) { ctx.stack = ctx.stack.slice(0, +c.dataset.c + 1); loadFolder(panel, ctx, courseId, tab); }
    else if (f) {
      const { it } = ctx.items[+f.dataset.f];
      if (itemId(it) == null) return console.warn('folder id missing', it);
      ctx.stack.push({ id: String(itemId(it)), title: itemTitle(it) });
      loadFolder(panel, ctx, courseId, tab);
    } else if (o) {
      const { it, kind } = ctx.items[+o.dataset.o];
      openFile(courseId, ctx.stack.at(-1).id, it, kind);
    } else if (e.target.closest('#more')) { ctx.page++; loadFolder(panel, ctx, courseId, tab, true); }
    else if (e.target.closest('#retry')) loadFolder(panel, ctx, courseId, tab, ctx.page > 1);
  };
  loadFolder(panel, ctx, courseId, tab);
}

async function loadFolder(panel, ctx, courseId, tab, append = false) {
  const cur = ctx.stack.at(-1);
  if (!append) { ctx.page = 1; ctx.items = []; }
  const crumbs = ctx.stack.map((s, i) => i === ctx.stack.length - 1
    ? `<b>${esc(s.title)}</b>`
    : `<button data-c="${i}">${esc(s.title)}</button><i>/</i>`).join('');
  const shell = body => { panel.innerHTML = `<div class="crumbs">${crumbs}</div>${body}`; };
  if (!append) shell(`<div class="rows">${'<div class="skel sm"></div>'.repeat(4)}</div>`);
  try {
    const res = await getContent(courseId, cur.id, tab.tab_id, tab.type, ctx.page);
    if (panel.dataset.cid != ctx.cid) return; // user dusre tab pe chala gaya
    console.log('content response', res);
    const arr = (firstArray(res) || []).flatMap(x => Array.isArray(x?.layout_data) ? x.layout_data : [x]);
    ctx.items = ctx.items.concat(arr.map(it => ({ it, kind: kindOf(it) })));
    const rows = ctx.items.map(({ it, kind }, i) => {
      const inner = `<span class="ico">${ICONS[kind]}</span><span class="t">${esc(itemTitle(it))}</span><span class="k">${LABEL[kind]}</span>`;
      return kind === 'folder' ? `<button class="row" data-f="${i}">${inner}</button>`
        : (kind === 'video' || kind === 'pdf') ? `<button class="row" data-o="${i}">${inner}</button>`
        : `<div class="row">${inner}</div>`;
    }).join('');
    shell(ctx.items.length
      ? `<div class="rows">${rows}</div>${arr.length >= 100 ? '<button class="more" id="more">Load more</button>' : ''}`
      : `<div class="msg">Nothing here yet.</div>`);
  } catch (e) {
    if (panel.dataset.cid != ctx.cid) return;
    shell(errorBox('Could not load content. ' + e.message, 'retry'));
  }
}

/* ---------- Video / PDF viewer ---------- */
const dlg = document.getElementById('viewer'), vbody = document.getElementById('vbody');
let hls = null, hlsLib = null;
const loadHls = () => hlsLib ??= new Promise((res, rej) => {
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js';
  s.onload = () => res(window.Hls); s.onerror = () => rej(new Error('Video player could not be loaded.'));
  document.head.appendChild(s);
});
function findUrl(o, re, d = 0) {
  if (typeof o === 'string') return /^https?:\/\//i.test(o) && re.test(o) ? o : null;
  if (!o || typeof o !== 'object' || d > 6) return null;
  for (const v of Object.values(o)) { const u = findUrl(v, re, d + 1); if (u) return u; }
  return null;
}
function closeViewer() {
  if (hls) { hls.destroy(); hls = null; }
  vbody.querySelector('video')?.pause();
  vbody.innerHTML = '';
}
dlg.addEventListener('close', closeViewer);
document.getElementById('vx').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

async function openFile(courseId, folderId, it, kind) {
  document.getElementById('vt').textContent = itemTitle(it);
  document.getElementById('vl').innerHTML = '';
  vbody.innerHTML = '<div class="skel" style="border-radius:0"></div>';
  if (!dlg.open) dlg.showModal();
  try {
    const res = await getSingle(courseId, folderId, itemId(it));
    console.log('single-content response', res);
    const url = kind === 'video'
      ? (findUrl(res, /\.m3u8(\?|#|$)/i) || findUrl(res, /\.mp4(\?|#|$)/i))
      : findUrl(res, /\.pdf(\?|#|$)/i);
    if (!url) throw new Error(it.data?.is_locked && !+it.data?.is_purchased ? 'This file is locked for this batch.' : `No ${kind === 'video' ? 'video' : 'PDF'} link found for this file.`);
    document.getElementById('vl').innerHTML = `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open in new tab</a>`;
    if (kind === 'pdf') { vbody.innerHTML = `<iframe src="${esc(url)}" title="${esc(itemTitle(it))}"></iframe>`; return; }
    vbody.innerHTML = '<video controls autoplay playsinline></video>';
    const v = vbody.querySelector('video');
    if (!/\.m3u8/i.test(url) || v.canPlayType('application/vnd.apple.mpegurl')) { v.src = url; return; }
    const Hls = await loadHls();
    if (!Hls.isSupported()) throw new Error('This browser cannot play this video.');
    hls = new Hls();
    hls.loadSource(url); hls.attachMedia(v);
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) vbody.insertAdjacentHTML('beforeend', '<div class="msg err">Video failed to play. Try “Open in new tab”.</div>'); });
  } catch (e) {
    vbody.innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
  }
}

/* ---------- Boot ---------- */
document.getElementById('home').onclick = showHome;
if (LOGO_URL) document.getElementById('mark').innerHTML = `<img src="${esc(LOGO_URL)}" alt="" onerror="this.remove()">`;
const m = location.hash.match(/^#batch=(.+)$/);
if (m) getBatches().then(r => { batches = firstArray(r) || []; batches.forEach(b => names[bId(b)] = bName(b)); }).catch(() => {}).finally(() => openBatch(decodeURIComponent(m[1])));
else showHome();
addEventListener('hashchange', () => { if (!location.hash) showHome(); });
</script>
