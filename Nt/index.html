<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F172A">
<title>Study Squad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  /* palette */
  --bg:#0F172A; --sec:#1B2A4A; --card:#1E293B;
  --head:#FFFFFF; --text:#CBD5E1;
  --o:#FF6B35; --y:#FFC46B; --p:#FF8A7A;
  /* glass */
  --glass:rgba(30,41,59,.55); --glass-2:rgba(27,42,74,.6);
  --line:rgba(255,255,255,.14); --hi:rgba(255,255,255,.08);
  --shadow:0 10px 34px rgba(2,6,23,.45);
  --blur:blur(14px) saturate(140%);
  --bgimg:url("https://files.catbox.moe/c2vzky.png");
  --r:16px;
  --fd:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --fb:'Figtree','Segoe UI',system-ui,sans-serif;
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--glass:rgba(30,41,59,.92);--glass-2:rgba(27,42,74,.94)}
}
*{box-sizing:border-box;margin:0}
html{scrollbar-color:rgba(255,255,255,.28) transparent}
body{background:var(--bg);color:var(--text);font:400 16px/1.55 var(--fb);min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(60% 45% at 85% 0%,rgba(255,107,53,.22),transparent 70%),
    radial-gradient(55% 45% at 0% 100%,rgba(255,138,122,.16),transparent 70%),
    linear-gradient(rgba(15,23,42,.55),rgba(15,23,42,.84)),
    var(--bgimg) center/cover no-repeat,
    var(--bg)}
::selection{background:var(--o);color:#fff}
button,input{font:inherit;color:inherit}
a{color:var(--y)}
:focus-visible{outline:3px solid var(--y);outline-offset:2px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

header{position:relative;background:rgba(15,23,42,.5);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--line);color:var(--head)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--o),var(--y),var(--p));opacity:.85}
.bar{display:flex;align-items:center;gap:12px;padding:14px 0}
.logo{display:flex;align-items:center;gap:12px;font:800 24px/1 var(--fd);letter-spacing:-.02em;cursor:pointer;background:none;border:0;color:var(--head)}
.mark{flex:none;width:42px;height:42px;border-radius:50%;overflow:hidden;background:rgba(255,107,53,.18);color:var(--y);border:2px solid var(--o);display:grid;place-items:center;font-size:16px;box-shadow:0 0 18px rgba(255,107,53,.35)}
.mark img{width:100%;height:100%;object-fit:cover;display:block}

h1{font:800 clamp(28px,5vw,40px)/1.1 var(--fd);letter-spacing:.05em;text-transform:uppercase;color:var(--head);margin:30px 0 0}
h1::after{content:"";display:block;width:56px;height:4px;border-radius:4px;margin-top:10px;background:linear-gradient(90deg,var(--o),var(--p))}
.search{margin:18px 0 16px;max-width:520px}
.search input{width:100%;padding:13px 18px;border-radius:999px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--head)}
.search input::placeholder{color:#94a3b8}
.search input:focus{border-color:var(--o);outline:none;box-shadow:0 0 0 3px rgba(255,107,53,.25)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding:12px 0 56px}
.card{display:flex;flex-direction:column;text-align:left;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;padding:0;box-shadow:var(--shadow)}
button.card{cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s}
button.card:hover{border-color:rgba(255,107,53,.75);transform:translateY(-3px);box-shadow:0 14px 40px rgba(255,107,53,.2)}
.thumb{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--sec),#4a2f52 55%,var(--o));font:800 40px var(--fd);color:#fff}
.thumb b{position:absolute;inset:0;display:grid;place-items:center;font:inherit}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card .t{padding:14px 16px 16px;font-weight:600;line-height:1.3;color:var(--head)}
.card .s{display:block;font-weight:400;font-size:13px;color:var(--text);opacity:.8;margin-top:4px}

.hero-slider{position:relative;margin-top:16px}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:20px;border:1px solid var(--line);aspect-ratio:2/1;background:var(--sec);box-shadow:var(--shadow)}
.slides::-webkit-scrollbar{display:none}
@media (min-width:900px){.slides{aspect-ratio:2.6/1}}
.slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;padding:0;border:0;cursor:pointer;background:linear-gradient(135deg,var(--sec),#4a2f52 55%,var(--o));color:#fff;font:800 48px var(--fd)}
.slide b{position:absolute;inset:0;display:grid;place-items:center;font:inherit}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.dots{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:9px;padding:7px 12px;border-radius:999px;background:rgba(15,23,42,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line)}
.dot{position:relative;width:9px;height:9px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.45);cursor:pointer;transition:transform .25s,background .25s}
.dot::before{content:"";position:absolute;inset:-7px}
.dot.on{background:var(--o);transform:scale(1.35)}

.back{display:inline-block;margin:22px 0 6px;padding:8px 18px;border:1px solid rgba(255,255,255,.7);border-radius:999px;background:transparent;color:var(--head);font-weight:600;cursor:pointer;transition:background .2s}
.back:hover{background:var(--hi)}
.title{font:800 clamp(24px,4vw,36px)/1.15 var(--fd);letter-spacing:-.02em;color:var(--head);margin:10px 0 18px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{flex:none;padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--text);cursor:pointer;font-weight:600;white-space:nowrap;transition:border-color .2s,background .2s}
.tab:hover{border-color:var(--o);color:var(--head)}
.tab[aria-selected=true]{background:var(--o);border-color:var(--o);color:#fff;box-shadow:0 6px 20px rgba(255,107,53,.35)}
.panel{padding:22px 0 60px}

.strips{display:grid;gap:10px}
.strip{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px 8px 8px;cursor:pointer;transition:border-color .2s,transform .2s}
.strip:hover{border-color:rgba(255,107,53,.75);transform:translateY(-2px)}
.strip .pi{flex:none;width:112px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,var(--sec),#4a2f52 55%,var(--o))}
.strip .pi img{width:100%;height:100%;object-fit:cover;display:block}
.strip .pt{flex:1;min-width:0;font-weight:600;line-height:1.3;overflow-wrap:anywhere;color:var(--head)}
.strip .go{flex:none;color:var(--y);font-size:22px}
.sec{display:flex;align-items:center;gap:10px;font:800 22px var(--fd);color:var(--head);margin:34px 0 14px}
.sec::before{content:"";width:5px;height:22px;border-radius:4px;background:linear-gradient(var(--o),var(--p))}
.desc{background:var(--glass-2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;max-width:78ch;line-height:1.75;overflow-wrap:anywhere;color:var(--text);box-shadow:var(--shadow)}
.desc p{margin:0 0 .8em}
.desc :is(h1,h2,h3,h4,h5,h6,strong,b,summary){color:var(--head)}
.desc summary{cursor:pointer;font-weight:600}
.desc img{display:block;max-width:100%;height:auto;margin:12px auto;border-radius:12px}
.desc table{display:block;max-width:100%;overflow-x:auto}
@media (max-width:600px){
  .about{max-width:none;margin-left:-20px;margin-right:-20px;border-left:0;border-right:0;border-radius:0;padding:16px 20px}
  .about img{width:100%}
}

.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-bottom:16px;font-weight:600}
.crumbs button{background:none;border:0;padding:4px 8px;border-radius:8px;color:var(--y);cursor:pointer}
.crumbs button:hover{background:var(--hi)}
.crumbs b{padding:4px 8px;color:var(--head)}
.crumbs i{color:var(--text);opacity:.5;font-style:normal}
.rows{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),rgba(30,41,59,.62);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
button.row{cursor:pointer;transition:border-color .2s,transform .2s}
button.row:hover{border-color:rgba(255,107,53,.75);transform:translateY(-2px)}
.ico{flex:none;width:42px;height:42px;border-radius:12px;background:rgba(255,107,53,.16);color:var(--y);display:grid;place-items:center}
.ico svg{width:22px;height:22px}
.th{flex:none;width:96px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--sec)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.row .t{flex:1;min-width:0;font-weight:600;line-height:1.3;overflow-wrap:anywhere;color:var(--head)}
.row .k{flex:none;font-size:13px;font-weight:600;background:rgba(255,196,107,.14);color:var(--y);border:1px solid rgba(255,196,107,.3);padding:2px 12px;border-radius:999px}

dialog{width:min(960px,94vw);max-height:94vh;margin:auto;padding:0;border:1px solid var(--line);border-radius:var(--r);background:rgba(15,23,42,.86);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);color:var(--text);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(5,8,20,.78);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.vh{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.vh h3{flex:1;font:800 18px/1.3 var(--fd);color:var(--head);overflow-wrap:anywhere}
.vh a{color:var(--y);font-weight:600;font-size:14px;white-space:nowrap}
.vh button{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:transparent;color:var(--head);font-size:20px;line-height:1;cursor:pointer}
.vh button:hover{background:var(--hi)}
.vb{padding:0}
.vb video{width:100%;aspect-ratio:16/9;background:#000;display:block}
.vb iframe{width:100%;height:78vh;border:0;display:block;background:#fff}
.vb .msg{margin:16px}
.more{display:block;margin:18px auto 0;padding:10px 24px;border-radius:999px;border:1px solid rgba(255,255,255,.75);background:transparent;color:var(--head);font-weight:600;cursor:pointer;transition:background .2s}
.more:hover{background:var(--hi)}

/* desktop: lambi strips/rows ki jagah chhote chocolate-piece jaise tiles */
@media (min-width:760px){
  .strips{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .strip{padding:8px 12px 8px 8px;gap:12px}
  .strip .pi{width:92px}
  .strip .pt,.row .t{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:15px}
  .strip .go{display:none}
  .rows{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .row{display:grid;grid-template-columns:auto 1fr;grid-template-areas:'i t' 'i k';column-gap:12px;row-gap:6px;align-items:center;padding:10px 12px}
  .row .ico,.row .th{grid-area:i;align-self:start}
  .row .t{grid-area:t}
  .row .k{grid-area:k;justify-self:start}
}
.skel{height:210px;border-radius:var(--r);background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.13) 50%,rgba(255,255,255,.05) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border:1px solid var(--line)}
.skel.sm{height:66px}
@keyframes sh{to{background-position:-200% 0}}
.msg{padding:28px;border:1px dashed rgba(255,255,255,.28);border-radius:var(--r);text-align:center;color:var(--text);background:var(--glass)}
.msg.err{color:var(--p);border-color:var(--p)}
.msg button{margin-top:12px;padding:9px 20px;border-radius:999px;border:0;background:var(--o);color:#fff;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(255,107,53,.35)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <button class="logo" id="home" aria-label="Study Squad home"><span class="mark" id="mark">SS</span>Study Squad</button>
</div></header>
<main class="wrap" id="app"></main>
<dialog id="viewer" aria-label="Viewer">
  <div class="vh"><h3 id="vt"></h3><span id="vl"></span><button id="vx" aria-label="Close">×</button></div>
  <div class="vb" id="vbody"></div>
</dialog>

<script>
const BASE = 'https://firebasegoogle-zeta.vercel.app';
// Ye batches list me nahi dikhenge (overview ke "Included batches" me wahi se khulte rahenge)
const HIDE = { ids: ['107', '186'], names: [/ncert\s*library/i, /prarambh.*11th|11th.*prarambh/i] };
const LOGO_URL = ''; // <- yahan logo image ka URL daalo (khali rakha to "SS" dikhega)
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;

/* ---------- API ---------- */
async function api(query) {
  let r;
  try { r = await fetch(`${BASE}/api/scholarverse?${query}`); }
  catch { throw new Error('Network/CORS error – check connection or API CORS headers.'); }
  if (!r.ok) throw new Error('Server responded with HTTP ' + r.status);
  return r.json();
}
const getBatches  = () => api('route=batches');
const getOverview = id => api('route=overview&course_id=' + enc(id));
const contentCache = new Map();
const getContent  = (course, folder, tab, type, page) => {
  const key = [course, folder, tab, type, page].join('|');
  if (contentCache.has(key)) return Promise.resolve(contentCache.get(key));
  return contentApi(course, folder, tab, type, page).then(r => (contentCache.set(key, r), r));
};
const contentApi = (course, folder, tab, type, page) =>
  api(`route=content&course_id=${enc(course)}&folder_id=${enc(folder)}&tab_id=${enc(tab)}&tab_type=${enc(type || 'content')}&page=${page}&limit=100`);

const getSingle = (course, folder, content) =>
  api(`route=single-content&course_id=${enc(course)}&folder_id=${enc(folder)}&content_id=${enc(content)}`);

/* ---------- Helpers ---------- */
function firstArray(o, d = 0) {
  if (Array.isArray(o)) return o;
  if (!o || typeof o !== 'object' || d > 3) return null;
  for (const k of ['data', 'batches', 'courses', 'results', 'items']) {
    const a = firstArray(o[k], d + 1); if (a) return a;
  }
  for (const v of Object.values(o)) { const a = firstArray(v, d + 1); if (a) return a; }
  return null;
}
const bId   = b => b?._id ?? b?.id ?? b?.course_id ?? b?.batch_id;
const bName = b => b?.name ?? b?.title ?? b?.batch_name ?? b?.course_name ?? 'Untitled batch';
const bImg  = b => b?.thumbnail ?? b?.image ?? b?.banner ?? b?.poster ?? b?.cover ?? b?.img;
const isHidden = b => HIDE.ids.includes(String(bId(b))) || HIDE.names.some(r => r.test(bName(b)));
const loadBatches = async () => (firstArray(await getBatches()) || []).filter(b => !isHidden(b));
const bSub  = b => b?.exam ?? b?.class ?? b?.category ?? b?.language ?? '';
const validity = b => (b?.valid_from && b?.valid_to) ? `Valid: ${date(b.valid_from)} – ${date(b.valid_to)}` : '';
const date = ts => ts ? new Date(+ts * 1000).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';

function clean(html) {
  const doc = new DOMParser().parseFromString(html || '', 'text/html');
  doc.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(n => n.remove());
  doc.body.querySelectorAll('*').forEach(el => {
    [...el.attributes].forEach(a => {
      const v = a.value.trim().toLowerCase();
      if (/^on/.test(a.name) || a.name === 'style' || ((a.name === 'href' || a.name === 'src') && v.startsWith('javascript:'))) el.removeAttribute(a.name);
    });
    if (el.tagName === 'A') { el.target = '_blank'; el.rel = 'noopener noreferrer'; }
    if (el.tagName === 'IMG') { el.loading = 'lazy'; el.removeAttribute('width'); el.removeAttribute('height'); }
  });
  doc.body.querySelectorAll('p').forEach(p => { if (!p.textContent.replace(/\u00a0/g, '').trim() && !p.querySelector('img')) p.remove(); });
  return doc.body.innerHTML;
}

/* ---------- Router (phone back button = ek step piche) ---------- */
// state: { b: batchId, from: parent batchId, t: tab index, p: [{id,title}] folder path, f: {id,title,kind,locked} open file, d: depth }
const cur = () => history.state || {};
const hashOf = st => st.b
  ? '#batch=' + enc(st.b) + (st.t ? '&tab=' + st.t : '') + (st.p?.length ? '&path=' + st.p.map(x => enc(x.id)).join(',') : '')
  : location.pathname + location.search;
function fromHash() {
  const q = new URLSearchParams(location.hash.slice(1)), b = q.get('batch');
  if (!b) return { d: 0 };
  return { d: 0, b, t: +q.get('tab') || 0, p: (q.get('path') || '').split(',').filter(Boolean).map(id => ({ id, title: 'Folder' })) };
}
function navTo(st) {
  const next = { ...st, d: (cur().d || 0) + 1 };
  history.pushState(next, '', hashOf(next));
  render(next, true);
}
addEventListener('popstate', e => render(e.state || fromHash()));

let viewKey = '', seq = 0;
const refresh = () => { viewKey = ''; render(cur()); };
async function render(st, fromNav) {
  const key = st.b ? [st.b, st.t || 0, (st.p || []).map(x => x.id).join('/')].join('|') : 'home';
  if (key !== viewKey) {
    viewKey = key;
    const my = ++seq;
    await (st.b ? showBatch(st, my) : showHome(my));
    if (my !== seq) return;
    if (fromNav) window.scrollTo(0, 0);
  }
  syncViewer(st);
}

/* ---------- Home ---------- */
let batches = [];
const names = {};   // id -> title (batches + packages)
const ovCache = {}; // batch id -> overview tabs
const skeletons = (n = 6, c = '') => `<div class="grid">${`<div class="skel ${c}"></div>`.repeat(n)}</div>`;
const errorBox = (msg, id) => `<div class="msg err"><p>${esc(msg)}</p><button id="${id}">Try again</button></div>`;

let slideTimer;
function mountCarousel() {
  clearInterval(slideTimer);
  const el = document.getElementById('strip');
  if (!el || !batches.length) return;
  el.innerHTML = `
    <div class="slides" aria-label="Batches">${batches.map(b => `
      <button class="slide" data-id="${esc(bId(b))}" aria-label="${esc(bName(b))}" title="${esc(bName(b))}">
        <b>${esc(bName(b).charAt(0))}</b>${bImg(b) ? `<img src="${esc(bImg(b))}" alt="" onerror="this.remove()">` : ''}
      </button>`).join('')}</div>
    ${batches.length > 1 ? `<div class="dots">${batches.map((_, i) => `<button class="dot" data-d="${i}" aria-label="Batch ${i + 1}"></button>`).join('')}</div>` : ''}`;
  const sl = el.querySelector('.slides'), dots = [...el.querySelectorAll('.dot')];
  const idx = () => Math.round(sl.scrollLeft / sl.clientWidth);
  const goTo = i => sl.scrollTo({ left: i * sl.clientWidth, behavior: 'smooth' });
  const mark = () => dots.forEach((d, i) => d.classList.toggle('on', i === idx()));
  sl.addEventListener('scroll', mark, { passive: true });
  el.addEventListener('click', e => {
    const d = e.target.closest('.dot'); if (d) return goTo(+d.dataset.d);
    const c = e.target.closest('.slide'); if (c) navTo({ b: c.dataset.id });
  });
  mark();
  if (batches.length < 2 || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  // auto-slide: hover / touch / focus ke waqt ruka rehta hai
  let hold = false;
  ['pointerenter', 'pointerdown', 'focusin'].forEach(ev => el.addEventListener(ev, () => hold = true));
  ['pointerleave', 'pointercancel', 'focusout'].forEach(ev => el.addEventListener(ev, () => hold = false));
  slideTimer = setInterval(() => {
    if (!el.isConnected) return clearInterval(slideTimer);
    if (hold || document.hidden) return;
    goTo((idx() + 1) % batches.length);
  }, 3500);
}

async function showHome(my) {
  clearInterval(slideTimer);
  $app.innerHTML = `
    <h1>Batches</h1>
    <div class="hero-slider" id="strip"></div>
    <div class="search"><input id="q" type="search" placeholder="Search batches" aria-label="Search batches"></div>
    <div id="list">${skeletons()}</div>`;
  const list = document.getElementById('list');
  try {
    if (!batches.length) {
      const l = await loadBatches();
      if (my !== seq) return;
      batches = l; batches.forEach(b => names[bId(b)] = bName(b));
    }
    const draw = term => {
      const t = term.trim().toLowerCase();
      const rows = batches.filter(b => bName(b).toLowerCase().includes(t));
      list.innerHTML = rows.length
        ? `<div class="grid">${rows.map(b => `
            <button class="card" data-id="${esc(bId(b))}">
              <div class="thumb"><b>${esc(bName(b).charAt(0))}</b>${bImg(b) ? `<img src="${esc(bImg(b))}" alt="" loading="lazy" onerror="this.remove()">` : ''}</div>
              <div class="t">${esc(bName(b))}${bSub(b) ? `<span class="s">${esc(bSub(b))}</span>` : ''}${validity(b) ? `<span class="s">${validity(b)}</span>` : ''}</div>
            </button>`).join('')}</div>`
        : `<div class="msg">No batches found${t ? ' for “' + esc(term) + '”' : ''}.</div>`;
    };
    draw('');
    mountCarousel();
    document.getElementById('q').oninput = e => draw(e.target.value);
    list.onclick = e => { const c = e.target.closest('.card[data-id]'); if (c) navTo({ b: c.dataset.id }); };
  } catch (e) {
    if (my !== seq) return;
    list.innerHTML = errorBox('Could not load batches. ' + e.message, 'retry');
    document.getElementById('retry').onclick = refresh;
  }
}

/* ---------- Batch ---------- */
const layout = (tab, type) => (tab.data || []).find(l => l.layout_type === type);

function overviewHTML(tab) {
  const d = layout(tab, 'details')?.layout_data?.[0];
  const pk = layout(tab, 'packages')?.layout_data || [];
  const fq = layout(tab, 'faqs')?.layout_data || [];
  pk.forEach(p => names[p.id] = p.title);
  if (!d && !pk.length && !fq.length) return `<div class="msg">Overview details are not available.</div>`;
  return `
    ${d?.description ? `<h3 class="sec">About this batch</h3><div class="desc about">${clean(d.description)}</div>` : ''}
    ${fq.length ? `<h3 class="sec">FAQ</h3>${fq.map(f => `<details class="desc" style="margin-bottom:8px"><summary>${esc(f.question ?? f.title)}</summary><p style="margin-top:8px">${clean(f.answer ?? f.description)}</p></details>`).join('')}` : ''}
    ${pk.length ? `<h3 class="sec">Included batches</h3><div class="strips" id="pkgs">${pk.map(p => `
      <button class="strip" data-pkg="${esc(p.id)}"><span class="pi">${p.thumbnail ? `<img src="${esc(p.thumbnail)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</span><span class="pt">${esc(p.title)}</span><span class="go" aria-hidden="true">›</span></button>`).join('')}</div>` : ''}`;
}

async function showBatch(st, my) {
  const id = st.b, path = st.p || [];
  const backBtn = `<button class="back" id="back">← ${st.from ? 'Back' : 'All batches'}</button>`;
  const onBack = () => navTo(st.from ? { b: st.from } : {});
  $app.innerHTML = `${backBtn}<h2 class="title">${esc(names[id] || 'Batch')}</h2>${skeletons(1)}`;
  document.getElementById('back').onclick = onBack;
  let tabs;
  try {
    tabs = ovCache[id] ??= await fetchTabs(id);
  } catch (e) {
    if (my !== seq) return;
    $app.querySelector('.skel').outerHTML = errorBox('Could not load overview. ' + e.message, 'retry');
    document.getElementById('retry').onclick = refresh;
    return;
  }
  if (my !== seq) return;
  const ov = tabs.find(x => x.type === 'overview') || tabs[0];
  const name = layout(ov, 'details')?.layout_data?.[0]?.title || names[id] || 'Batch';
  names[id] = name;
  const ti = tabs[st.t || 0] ? (st.t || 0) : 0, tab = tabs[ti];
  $app.innerHTML = `
    ${backBtn}
    <h2 class="title">${esc(name)}</h2>
    <div class="tabs" role="tablist" aria-label="Batch sections">
      ${tabs.map((x, i) => `<button class="tab" role="tab" data-i="${i}" aria-selected="${i === ti}">${esc(x.title)}</button>`).join('')}
    </div>
    <div class="panel" role="tabpanel" id="panel"></div>`;
  document.getElementById('back').onclick = onBack;
  document.querySelector('.tabs').onclick = e => {
    const b = e.target.closest('.tab');
    if (b && +b.dataset.i !== ti) navTo({ b: id, from: st.from, t: +b.dataset.i });
  };
  const panel = document.getElementById('panel');
  if (tab.type === 'overview') {
    panel.innerHTML = overviewHTML(tab);
    const pk = document.getElementById('pkgs');
    if (pk) pk.onclick = e => { const c = e.target.closest('[data-pkg]'); if (c) navTo({ b: c.dataset.pkg, from: id }); };
    return;
  }
  openContent(panel, st, ti, tab, path, my);
}

async function fetchTabs(id) {
  const res = await getOverview(id);
  const tabs = Array.isArray(res?.data) ? res.data : [];
  if (!tabs.length) throw new Error(res?.message || 'No details returned for this batch.');
  return tabs;
}

/* ---------- Tab content (folders) ---------- */
const ICONS = {
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z" fill="currentColor"/></svg>',
  pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
  other: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>'
};
const LABEL = { folder: 'Folder', video: 'Video', pdf: 'PDF', other: 'File' };

function kindOf(it) {
  const t = String(it.type ?? '').toLowerCase();
  if (/folder/.test(t) || it.is_folder === true || +it.is_folder === 1) return 'folder';
  const d = it.data || {};
  const ft = d.file_type ?? d.content_type;   // 1 = PDF, 2 = video
  if (ft == 2) return 'video';
  if (ft == 1) return 'pdf';
  const m = v => { const x = String(v ?? '').toLowerCase(); return /video|lecture|m3u8|mp4/.test(x) ? 'video' : /pdf/.test(x) ? 'pdf' : null; };
  return m(it.file_type) || m(it.content_type) || 'other';
}
const itemId = it => it.entity_id ?? it.id ?? it._id ?? it.folder_id;
const itemTitle = it => it.title ?? it.name ?? it.file_name ?? 'Untitled';

function openContent(panel, st, ti, tab, path, my) {
  const ctx = { items: [], page: 1 };
  const base = { b: st.b, from: st.from, t: ti };
  // ek hi delegated handler: breadcrumbs, folders, files, load more, retry
  panel.onclick = e => {
    const c = e.target.closest('[data-c]'), f = e.target.closest('[data-f]'), o = e.target.closest('[data-o]');
    if (c) navTo({ ...base, p: path.slice(0, +c.dataset.c) });
    else if (f) {
      const { it } = ctx.items[+f.dataset.f];
      if (itemId(it) == null) return console.warn('folder id missing', it);
      navTo({ ...base, p: [...path, { id: String(itemId(it)), title: itemTitle(it) }] });
    } else if (o) {
      const { it, kind } = ctx.items[+o.dataset.o];
      const locked = !!(+it.data?.is_locked && !+it.data?.is_purchased);
      navTo({ ...base, p: path, f: { id: String(itemId(it)), title: itemTitle(it), kind, locked } });
    } else if (e.target.closest('#more')) { ctx.page++; loadFolder(panel, ctx, st, tab, path, my, true); }
    else if (e.target.closest('#retry')) loadFolder(panel, ctx, st, tab, path, my, ctx.page > 1);
  };
  loadFolder(panel, ctx, st, tab, path, my);
}

async function loadFolder(panel, ctx, st, tab, path, my, append = false) {
  const stack = [{ id: '0', title: tab.title }, ...path];
  if (!append) { ctx.page = 1; ctx.items = []; }
  const crumbs = stack.map((s, i) => i === stack.length - 1
    ? `<b>${esc(s.title)}</b>`
    : `<button data-c="${i}">${esc(s.title)}</button><i>/</i>`).join('');
  const shell = body => { panel.innerHTML = `<div class="crumbs">${crumbs}</div>${body}`; };
  if (!append) shell(`<div class="rows">${'<div class="skel sm"></div>'.repeat(4)}</div>`);
  try {
    const res = await getContent(st.b, stack.at(-1).id, tab.tab_id, tab.type, ctx.page);
    if (my !== seq) return; // user kahin aur chala gaya
    const arr = (firstArray(res) || []).flatMap(x => Array.isArray(x?.layout_data) ? x.layout_data : [x]);
    ctx.items = ctx.items.concat(arr.map(it => ({ it, kind: kindOf(it) })));
    const rows = ctx.items.map(({ it, kind }, i) => {
      const th = String(it.data?.thumbnail ?? '').trim();
      const lead = /^https?:/i.test(th)
        ? `<span class="th"><img src="${esc(th)}" alt="" loading="lazy" onerror="this.remove()"></span>`
        : `<span class="ico">${ICONS[kind]}</span>`;
      const inner = `${lead}<span class="t">${esc(itemTitle(it))}</span><span class="k">${LABEL[kind]}</span>`;
      return kind === 'folder' ? `<button class="row" data-f="${i}">${inner}</button>`
        : (kind === 'video' || kind === 'pdf') ? `<button class="row" data-o="${i}">${inner}</button>`
        : `<div class="row">${inner}</div>`;
    }).join('');
    shell(ctx.items.length
      ? `<div class="rows">${rows}</div>${arr.length >= 100 ? '<button class="more" id="more">Load more</button>' : ''}`
      : `<div class="msg">Nothing here yet.</div>`);
  } catch (e) {
    if (my !== seq) return;
    shell(errorBox('Could not load content. ' + e.message, 'retry'));
  }
}

/* ---------- Video / PDF viewer ---------- */
const dlg = document.getElementById('viewer'), vbody = document.getElementById('vbody');
let hls = null, hlsLib = null, openedFile = null, popClose = false;
const loadHls = () => hlsLib ??= new Promise((res, rej) => {
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js';
  s.onload = () => res(window.Hls); s.onerror = () => rej(new Error('Video player could not be loaded.'));
  document.head.appendChild(s);
});
function findUrl(o, re, d = 0) {
  if (typeof o === 'string') return /^https?:\/\//i.test(o) && re.test(o) ? o : null;
  if (!o || typeof o !== 'object' || d > 6) return null;
  for (const v of Object.values(o)) { const u = findUrl(v, re, d + 1); if (u) return u; }
  return null;
}
function closeViewer() {
  if (hls) { hls.destroy(); hls = null; }
  vbody.querySelector('video')?.pause();
  vbody.innerHTML = '';
  openedFile = null;
}
// X / Esc / bahar click => history ka ek step piche (phone back jaisa hi)
dlg.addEventListener('close', () => {
  closeViewer();
  if (popClose) { popClose = false; return; }
  if (cur().f) history.back();
});
document.getElementById('vx').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

function syncViewer(st) {
  if (st.f) {
    if (dlg.open && openedFile === st.f.id) return;
    openFile(st.b, (st.p || []).at(-1)?.id ?? '0', st.f);
  } else if (dlg.open) { popClose = true; dlg.close(); }
}

async function openFile(courseId, folderId, f) {
  openedFile = f.id;
  document.getElementById('vt').textContent = f.title;
  document.getElementById('vl').innerHTML = '';
  vbody.innerHTML = '<div class="skel" style="border-radius:0"></div>';
  if (!dlg.open) dlg.showModal();
  try {
    const res = await getSingle(courseId, folderId, f.id);
    if (openedFile !== f.id) return; // beech me band ho gaya
    console.log('single-content response', res);
    const url = f.kind === 'video'
      ? (findUrl(res, /\.m3u8(\?|#|$)/i) || findUrl(res, /\.mp4(\?|#|$)/i))
      : findUrl(res, /\.pdf(\?|#|$)/i);
    if (!url) throw new Error(f.locked ? 'This file is locked for this batch.' : `No ${f.kind === 'video' ? 'video' : 'PDF'} link found for this file.`);
    document.getElementById('vl').innerHTML = `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open in new tab</a>`;
    if (f.kind === 'pdf') { vbody.innerHTML = `<iframe src="${esc(url)}" title="${esc(f.title)}"></iframe>`; return; }
    vbody.innerHTML = '<video controls autoplay playsinline></video>';
    const v = vbody.querySelector('video');
    if (!/\.m3u8/i.test(url) || v.canPlayType('application/vnd.apple.mpegurl')) { v.src = url; return; }
    const Hls = await loadHls();
    if (openedFile !== f.id) return;
    if (!Hls.isSupported()) throw new Error('This browser cannot play this video.');
    hls = new Hls();
    hls.loadSource(url); hls.attachMedia(v);
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) vbody.insertAdjacentHTML('beforeend', '<div class="msg err">Video failed to play. Try “Open in new tab”.</div>'); });
  } catch (e) {
    if (openedFile === f.id) vbody.innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
  }
}

/* ---------- Boot ---------- */
document.getElementById('home').onclick = () => cur().b ? navTo({}) : window.scrollTo({ top: 0, behavior: 'smooth' });
if (LOGO_URL) document.getElementById('mark').innerHTML = `<img src="${esc(LOGO_URL)}" alt="" onerror="this.remove()">`;
const st0 = history.state || fromHash();
history.replaceState(st0, '', location.href);
render(st0);
</script>
